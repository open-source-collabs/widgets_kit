name: widgets_kit
description: Send data from Flutter to native home screen widgets on Android, iOS and macOS, update them, and handle taps with Dart code.
version: 0.1.1
repository: https://github.com/open-source-collabs/widgets_kit
issue_tracker: https://github.com/open-source-collabs/widgets_kit/issues
screenshots:
  - description: 'The example home screen widget in the iOS widget gallery.'
    path: screenshots/widget-gallery.png
  - description: 'The example widget placed on an iOS home screen.'
    path: screenshots/home-screen.png
  - description: 'The example Glance widget on an Android home screen, showing text and a rendered Flutter image.'
    path: screenshots/android-home-screen.png

topics:
  - home-screen-widget
  - native
  - android
  - ios

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  path_provider: ^2.1.3
  path_provider_foundation: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  golden_toolkit: ^0.15.0
  mocktail: ^1.0.3
  path_provider_platform_interface:
  plugin_platform_interface:

flutter:
  plugin:
    platforms:
      android:
        package: com.widgetskit.widgets_kit
        pluginClass: WidgetsKitPlugin
      ios:
        pluginClass: WidgetsKitPlugin
      macos:
        pluginClass: WidgetsKitPlugin
      windows:
        dartPluginClass: WidgetsKitWindows
      linux:
        dartPluginClass: WidgetsKitLinux
      web:
        pluginClass: WidgetsKitWeb
        fileName: src/web/widgets_kit_web.dart
